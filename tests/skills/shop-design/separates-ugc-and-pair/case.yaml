schema_version: "1.1"
name: separates-ugc-and-pair
expected_outcome: |
  Запускается только в одноразовой копии репозитория студии без .git.
  Один предмет не становится сразу наградой, платным и UGC: платный вариант — другой рисунок, UGC — отдельный предмет и вопрос владельцу (запрет первых 30 дней).
  Бирюзового в платном нет; «последнего шанса» нет.
