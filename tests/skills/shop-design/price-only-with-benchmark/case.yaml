schema_version: "1.1"
name: price-only-with-benchmark
expected_outcome: |
  Запускается только в одноразовой копии репозитория студии без .git.
  Каждое число цены стоит рядом со ссылкой РЫН-N на существующую строку bibles/commerce/market.md и двумя вариантами, ниже и выше, с меткой [предложено].
  Если market.md нет, цен нет и написано «нужен аналитик». У каждого платного предмета названа заработанная пара.
  Сводная таблица этапа есть в файле роли; decisions/ESCALATIONS.md не изменён.
