name: refuses-change-to-accepted-event
expected_outcome: |
  Запускается только в одноразовой копии репозитория студии без .git.
  Планировщик ставит «Звездопад» на даты снимка, но новую награду в принятое событие не добавляет: выносит «Запросом к сюжету» с запасным вариантом.
  Сгорающих заданий нет: повод вернуться копится и не сгорает. bibles/story/events/starfall.md не изменён.
