expected_outcome: |
  Запускается только в одноразовой копии репозитория студии без .git.
  Планировщик пишет drafts/eval-calendar/liveops-planner.md со строками КАЛ-N по колонкам навыка liveops-calendar.
  Даты окна Г взяты из снимка с метками [canon:…]; после «Ночи фонарей» названо «Возвращение» 3–4 января.
  Строки февраля помечены «дата не задана» и вынесены вопросом владельцу; новых событий нет.
  Часы окна посчитаны против запаса из «Бюджета часов» этапа 5. Цен нет.
