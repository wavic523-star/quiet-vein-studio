schema_version: "1.1"
name: catches-planted-violations
expected_outcome: |
  Запускается только в одноразовой копии репозитория студии без .git (нужны canon/ и docs/).
  В черновик подложено семь нарушений. Контролёр пишет review.md с вердиктом REJECT,
  называет ворота G1 (строка закрывает ответ на загадку о койках и рельсах) и G2 (цена и срочность),
  показывает расхождение «400 Part» против «250» в каноне с цитатами обеих сторон,
  находит число без метки (высота арки 14 studs), неверную версию снимка в шапке (742 вместо 760)
  и строку [предложено], которой нет в таблице «Новое». Сам черновик он не правит.
context:
  scaffold_script: place-files.sh
