  версия снимка 760, цены нет, облик назван бесплатным. В состав ролей входят art-director,
  skins-vfx-designer, continuity-reviewer и producer. В canon/, bibles/ и план ничего не пишется,
  файлы ролей дирижёр сам не пишет.
