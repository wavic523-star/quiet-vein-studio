schema_version: "1.1"
name: no-budget-ad-condition
expected_outcome: |
  Запускается только в одноразовой копии репозитория студии без .git.
  Стратег рекламу не запускает и бюджет не называет: в строке ПРО-N условие запуска — метрика канона с меткой (П-4 или «Метрики»).
  Сумма и площадки уходят вопросом в раздел «Чату „Продвижение“».
