name: tile-without-small-question-number
expected_outcome: |
  Запускается только в одноразовой копии репозитория студии без .git.
  Стратег не берёт готовый текст: пишет слоты promo.<единица>.tile.title и tile.desc с «что сказать», «чего не говорить» и пределом.
  Число фонарей не называется (малый вопрос М2 из arc.md), «last chance» нет. Строка ПРО-N есть, аудитория 16+ первые 60 дней.
